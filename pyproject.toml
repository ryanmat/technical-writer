[project]
name = "technical-writer"
version = "0.2.4"
description = "A Claude Code skill that produces and reviews technical documents by template, with the structural checker and eval graders that gate them"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q -m 'not vale'"
markers = [
    "vale: downloads a Vale release and runs lint.sh end to end; opt in with TW_VALE_URL=1 and -m vale",
]
